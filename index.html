<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Color Spin · 混色达人</title>
<style>
:root{--bg:#f5f5f7;--card:rgba(255,255,255,.78);--text:#1d1d1f;--muted:#86868b;--line:rgba(0,0,0,.08);--accent:#0071e3;--shadow:0 20px 60px rgba(0,0,0,.10),0 2px 10px rgba(0,0,0,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;background:radial-gradient(900px 500px at 15% -10%,rgba(120,180,255,.22),transparent 60%),radial-gradient(900px 500px at 90% 110%,rgba(255,170,210,.18),transparent 60%),var(--bg);color:var(--text)}
button{font:inherit;border:0;cursor:pointer}
.app{max-width:1060px;margin:0 auto;padding:28px 18px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.04em;margin:0;font-weight:800}
.sub{color:var(--muted);margin-top:6px;font-size:15px}
.hud{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(16px);border-radius:999px;padding:10px 14px;font-size:14px}
.pill b{font-size:18px}
.pill button{background:none;font-weight:800;color:var(--accent);padding:0}
.stage{background:var(--card);border:1px solid var(--line);border-radius:36px;box-shadow:var(--shadow);backdrop-filter:blur(20px);padding:22px}
.board{display:grid;grid-template-columns:86px 1fr 86px;align-items:center;gap:14px}
.keys{display:grid;gap:8px}
.key{height:54px;border-radius:14px;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 6px 14px rgba(0,0,0,.12);transition:.18s;color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.key small{position:absolute;right:8px;bottom:6px;font-size:10px;opacity:.85}
.key.selected{transform:scale(1.05);outline:3px solid var(--text);outline-offset:2px}
.key.selected::after{content:"✓";position:absolute;left:10px;top:8px;font-size:18px}
.key.hint{animation:hintFlash .35s ease-in-out 3;z-index:2}
@keyframes hintFlash{0%,100%{transform:scale(1);outline:none}50%{transform:scale(1.14);outline:4px solid #ffcc00;outline-offset:3px}}
.center{text-align:center;position:relative;padding-top:8px}
.pointer{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:18px solid var(--text);margin:0 auto -8px;position:relative;z-index:3}
.disc-wrap{width:min(390px,78vw);aspect-ratio:1;margin:0 auto;position:relative}
.disc{position:absolute;inset:0;border-radius:50%;background:#fff;box-shadow:0 24px 50px rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.06);will-change:transform;overflow:hidden}
.blend{position:absolute;inset:0;border-radius:50%;background:#fff;opacity:0;pointer-events:none;z-index:1}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;z-index:2;box-shadow:0 10px 28px rgba(0,0,0,.18);text-align:center;padding:10px}
.hub .mix{width:72%;height:62%;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
.hub span{font-size:12px;color:var(--muted);font-weight:700}
.speed{height:6px;background:#e8e8ed;border-radius:99px;margin:14px auto 0;max-width:320px;overflow:hidden}
.speed i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ac8fa,#007aff,#ff2d92);transition:width .08s linear}
.target{margin:16px auto 4px;max-width:520px}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:800}
.swatch{height:54px;border-radius:16px;margin-top:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 10px 24px rgba(0,0,0,.10);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35);font-weight:800}
.controls{margin-top:16px;display:grid;gap:12px}
#start{height:62px;border-radius:999px;background:var(--text);color:#fff;font-size:20px;font-weight:800;box-shadow:0 14px 30px rgba(0,0,0,.18);user-select:none;touch-action:none}
#start.holding{background:var(--accent);transform:scale(.985)}
#next{height:50px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;display:none}
#next.show{display:block}
.result{display:none;border-radius:20px;background:rgba(255,255,255,.75);border:1px solid var(--line);padding:16px;text-align:left}
.result.show{display:block}
.result h2{margin:0 0 8px;font-size:28px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 4px;border-top:1px solid var(--line)}td:first-child{color:var(--muted)}td:last-child{text-align:right;font-weight:700}
.tips{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.7;text-align:center}

button:focus-visible{outline:3px solid #0071e3;outline-offset:3px}
.key{transition:transform .2s,box-shadow .2s,outline .2s}
.key:active{transform:scale(.92)}
#start{transition:transform .2s,background .2s,box-shadow .2s}
#start:active{transform:scale(.98)}
.result.show{animation:appear .35s ease both}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){
 .app{padding:20px 14px max(24px,env(safe-area-inset-bottom))}
 header{display:block;margin-bottom:14px} h1{font-size:30px}.sub{font-size:13px;line-height:1.5}
 .hud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:14px}
 .pill{padding:8px 3px;text-align:center;font-size:11px;white-space:nowrap}.pill b{font-size:15px}
 .stage{padding:18px 14px;border-radius:26px}.board{display:flex;flex-wrap:wrap;gap:8px}
 .center{order:0;width:100%;padding:0 0 8px}.disc-wrap{width:min(270px,68vw)}
 .keys{order:1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;width:100%}
 .keys.right{order:2}.key{height:48px;border-radius:12px}.key small{display:none}
 .key.selected{outline-width:2px;outline-offset:1px}.key.selected::after{left:6px;top:4px;font-size:15px}
 .target{margin:14px auto 0}.swatch{height:46px}.controls{margin-top:14px;gap:9px}
 #start{height:58px;font-size:17px}.tips{font-size:12px;text-align:left;margin-bottom:0}
}
@media(max-width:350px){.pill{font-size:10px}.key{height:42px}.disc-wrap{width:min(230px,65vw)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}


header{justify-content:center;text-align:center}header>div:first-child{width:100%}h1{background:linear-gradient(90deg,#ff3b30,#ff9500,#e3bd00,#34c759,#007aff,#af52de,#ff2d92);background-clip:text;-webkit-background-clip:text;color:transparent}.hud{justify-content:center}
.key{background-image:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.08) 42%,rgba(0,0,0,.17)),linear-gradient(0deg,rgba(255,255,255,.12),transparent 45%);box-shadow:inset 0 2px 3px rgba(255,255,255,.75),inset 0 -3px 6px rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.16)}
.swatch{background-image:linear-gradient(145deg,rgba(255,255,255,.45),transparent 50%,rgba(0,0,0,.12));box-shadow:inset 0 2px 4px rgba(255,255,255,.6),inset 0 -3px 8px rgba(0,0,0,.12),0 10px 24px rgba(0,0,0,.1)}
.action-row{display:flex;align-items:stretch;gap:8px}.action-row #start{flex:2;min-width:0;font-size:clamp(22px,3vw,28px)}.action-row #prev,.action-row #next{flex:1;min-width:0;height:auto;border-radius:999px;font-size:32px;font-weight:800}.action-row #prev{background:#e8e8ed;color:var(--text)}.action-row #prev:disabled{opacity:.4;cursor:default}.action-row #next:not(.show){display:block;opacity:.4}.action-row #next:not(.show){pointer-events:none}
.celebration{position:fixed;inset:0;pointer-events:none;z-index:20;display:grid;place-items:center;font-size:clamp(70px,20vw,150px);animation:celebrate 2s ease-out forwards;filter:drop-shadow(0 10px 20px #ff9d00aa)}@keyframes celebrate{0%{opacity:0;transform:scale(.2) rotate(-20deg)}20%{opacity:1;transform:scale(1.2) rotate(10deg)}50%{transform:scale(1) rotate(0)}100%{opacity:0;transform:translateY(-100px) scale(1.3)}}

.menu-wrap{position:absolute;right:0;top:0;z-index:10}.app{position:relative}.menu-button{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.85);box-shadow:0 6px 20px #00000012;color:#1d1d1f;font-size:25px}.menu-panel{position:absolute;right:0;top:52px;width:230px;padding:16px;border:1px solid #ffffffb3;border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 20px 50px #2222;text-align:left}.menu-panel[hidden]{display:none}.menu-panel strong{display:block;font-size:15px;margin-bottom:5px}.menu-panel p{font-size:12px;color:#86868b;line-height:1.5;margin:0 0 12px}.mode-button{display:block;width:100%;padding:12px;margin-top:7px;border-radius:13px;text-align:left;background:#f2f3f7;color:#1d1d1f}.mode-button.active{background:#e5f1ff;color:#0071e3;font-weight:800}.mode-button small{display:block;margin-top:3px;opacity:.7}.level-note{font-size:12px;color:#86868b;margin:8px 0 0;text-align:center}.board{align-items:center}.keys{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:130px 1fr 130px}.key{height:46px}@media(max-width:700px){.menu-wrap{right:14px;top:16px}.menu-button{width:40px;height:40px}header h1{padding:0 44px}.board{display:flex}.keys{grid-template-columns:repeat(6,minmax(0,1fr))}.key{height:46px}}
</style>
</head>
<body>
<main class="app">
<div class="menu-wrap"><button class="menu-button" id="menuButton" aria-label="打开难度菜单" aria-expanded="false">☰</button><div class="menu-panel" id="menuPanel" hidden><strong>选择难度</strong><p>每种难度独立保存进度，共 100 关。</p><button class="mode-button" data-mode="12">12 色 · 经典<small>循序渐进，探索混色</small></button><button class="mode-button" data-mode="24">24 色 · 进阶<small>更多色彩，挑战眼力</small></button></div></div>
<header><div><h1>Color Spin</h1></div>
<div class="hud"><div class="pill">第 <b id="round">1</b>/100 关</div><div class="pill">总分 <b id="total">0</b></div><div class="pill">尝试 <b id="attempts">0</b>/3</div><div class="pill">已选 <b id="count">0</b>/<span id="paletteSize">12</span></div><div class="pill"><button id="reset">重开</button></div></div></header>
<section class="stage">
<div class="board"><div class="keys left" id="leftKeys"></div>
<div class="center"><div class="pointer"></div>
<div class="disc-wrap"><div class="disc" id="disc"></div><div class="blend" id="blend"></div>
<div class="hub"><div><div class="mix" id="mix"></div><span id="mixLabel">混合色</span></div></div></div>
<div class="speed"><i id="speedBar"></i></div>
<div class="target"><div class="swatch" id="target"><span>TARGET</span><span id="targetHex"></span></div></div></div>
<div class="keys right" id="rightKeys"></div></div>
<div class="level-note" id="levelNote"></div><div class="controls"><div class="action-row"><button id="prev" aria-label="上一轮">←</button><button id="start">START</button><button id="next" aria-label="下一轮">→</button></div><div class="result" id="result" aria-live="polite"></div></div>
<p class="tips" style="text-align: center;">点选色块，随时 START ｜3 次未达 85 分，提示组合。</p>
</section></main>
<script>
const BASE_COLORS=[{name:'红',hex:'#ff3b30',key:'Q'},{name:'橙',hex:'#ff9500',key:'W'},{name:'黄',hex:'#ffcc00',key:'E'},{name:'绿',hex:'#34c759',key:'R'},{name:'青',hex:'#5ac8fa',key:'T'},{name:'蓝',hex:'#007aff',key:'Y'},{name:'紫',hex:'#5856d6',key:'U'},{name:'粉',hex:'#ff2d92',key:'I'},{name:'棕',hex:'#8e6b4a',key:'O'},{name:'灰',hex:'#8e8e93',key:'P'},{name:'深绿',hex:'#0f766e',key:'['},{name:'黑',hex:'#1c1c1e',key:']'}];
const EXTRA_COLORS=[{name:'珊瑚',hex:'#ff6b6b'},{name:'金橙',hex:'#ffb347'},{name:'柠檬',hex:'#f3e55b'},{name:'青柠',hex:'#a3d94d'},{name:'薄荷',hex:'#4dd6a1'},{name:'湖蓝',hex:'#24b8c4'},{name:'天蓝',hex:'#89bfff'},{name:'靛蓝',hex:'#3844a8'},{name:'薰衣草',hex:'#a78bea'},{name:'玫红',hex:'#d94f84'},{name:'米色',hex:'#d8bc98'},{name:'白',hex:'#ffffff'}];
let mode=Number(localStorage.getItem('colorspin_mode'))===24?24:12;
let COLORS=mode===24?BASE_COLORS.concat(EXTRA_COLORS):BASE_COLORS;
const PASS=85, LEVELS=100;
let SAVE=mode===12?'colorspin_save_v2':'colorspin_save_24_v1';
function difficulty(n){return n<=2?1:n<=20?2:n<=40?3:n<=60?4:n<=80?5:6}
function shuffledIndices(){const a=[...COLORS.keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const $=id=>document.getElementById(id);
let selected=new Set(),round=1,scores=[],attempts=0,best=0,target=null,correct=[],revealed=false,passed=false;
let roundHistory={}, advanceTimer=null;
function cancelAdvance(){if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null}}
let angle=0,vel=0,spinning=false,raf=null,last=0,hasScoredOnce=false;
function hexRgb(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function rgbHex(a){return'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function mixRgb(l){if(!l.length)return[255,255,255];return l.reduce((s,c)=>{const r=hexRgb(c);return[s[0]+r[0],s[1]+r[1],s[2]+r[2]]},[0,0,0]).map(v=>v/l.length)}
function lab(rgb){function f(c){c/=255;return c>.04045?Math.pow((c+.055)/1.055,2.4):c/12.92}let[r,g,b]=rgb.map(f);let x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883;function t(v){return v>.008856?Math.cbrt(v):7.787*v+16/116}return[116*t(y)-16,500*(t(x)-t(y)),200*(t(y)-t(z))]}
function dE(a,b){const A=lab(a),B=lab(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({round,scores,attempts,best,target,correct,revealed,passed,selected:[...selected],angle,roundHistory}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE));if(!s)return false;round=s.round;scores=s.scores||[];attempts=s.attempts;best=s.best;target=s.target;correct=s.correct;revealed=s.revealed;passed=s.passed;selected=new Set(s.selected||[]);angle=s.angle||0;roundHistory=s.roundHistory||{};return true}catch(e){return false}}
function total(){return scores.reduce((a,b)=>a+b,0)}
function buildKeys(){const L=$('leftKeys'),R=$('rightKeys');L.innerHTML='';R.innerHTML='';COLORS.forEach((c,i)=>{const b=document.createElement('button');b.className='key';b.style.backgroundColor=c.hex;b.title=c.name+' '+c.hex;b.setAttribute('aria-label',c.name+' '+c.hex);b.setAttribute('aria-pressed','false');b.innerHTML=c.key?`<small>${c.key}</small>`:'';b.onclick=()=>toggle(i);(i<COLORS.length/2?L:R).appendChild(b)})}
function toggle(i){selected.has(i)?selected.delete(i):selected.add(i);tone(220*Math.pow(2,i/12));document.querySelectorAll('.key')[i].classList.toggle('selected',selected.has(i));document.querySelectorAll('.key')[i].setAttribute('aria-pressed',selected.has(i));renderDisc();updateHud();save()}
function renderDisc(){const list=[...selected].map(i=>COLORS[i].hex);const d=$('disc');if(!list.length)d.style.background='#fff';else{const st=360/list.length;d.style.background=`conic-gradient(${list.map((c,i)=>`${c} ${i*st}deg ${(i+1)*st}deg`).join(',')})`}const m=mixRgb(list);$('mix').style.background=rgbHex(m);$('blend').style.background=rgbHex(m);$('mixLabel').textContent=list.length?('混合色 '+rgbHex(m).toUpperCase()):'混合色'}
function updateHud(){$('paletteSize').textContent=mode;$('levelNote').textContent=`${mode} 色挑战 · 本关由 ${correct.length} 种颜色混合`; $('round').textContent=round;$('total').textContent=total();$('attempts').textContent=attempts;$('count').textContent=selected.size}
function paintTarget(){$('target').style.backgroundColor=rgbHex(target);$('targetHex').textContent=rgbHex(target).toUpperCase()}
function snapshot(){roundHistory[round]={target,correct,attempts,best,revealed,passed,selected:[...selected]}}
function newRound(keepTarget){
 if(!keepTarget){const size=difficulty(round);correct=shuffledIndices().slice(0,size);target=mixRgb(correct.map(i=>COLORS[i].hex));attempts=0;best=0;revealed=false;passed=false;hasScoredOnce=false}
 document.querySelectorAll('.key').forEach(k=>k.classList.remove('selected','hint'));
 document.querySelectorAll('.key').forEach((k,i)=>k.setAttribute('aria-pressed',selected.has(i)));selected.forEach(i=>document.querySelectorAll('.key')[i].classList.add('selected'));
 $('result').classList.remove('show');$('next').classList.remove('show');
 $('prev').disabled=round<=1;paintTarget();renderDisc();updateHud();save();
}
function reveal(){revealed=true;correct.forEach(i=>{const k=document.querySelectorAll('.key')[i];k.classList.remove('hint');void k.offsetWidth;k.classList.add('hint')});document.querySelector('.board').scrollIntoView({behavior:'smooth',block:'center'});tone(880);save()}
function score(){
 if(!selected.size){alert('请先至少选择 1 种颜色');return}
 const m=mixRgb([...selected].map(i=>COLORS[i].hex));const de=dE(m,target);const s=Math.max(0,Math.min(100,Math.round(100-de*1.15)));
 let testOnly=revealed;
 if(!testOnly){attempts++;if(s>best)best=s;scores[round-1]=best;if(s>=PASS)passed=true;if(attempts>=3&&best<PASS)reveal()}
 if(s===100&&!testOnly){const el=document.createElement('div');el.className='celebration';el.textContent='🎉';document.body.appendChild(el);setTimeout(()=>el.remove(),2100);if('speechSynthesis' in window){const msg=new SpeechSynthesisUtterance('太棒了！满分！');msg.lang='zh-CN';speechSynthesis.cancel();speechSynthesis.speak(msg)}}
 const r=$('result');r.classList.add('show');
 const names=correct.map(i=>COLORS[i].name).join(' + ');
 r.innerHTML=`<h2 style="text-align: center;">${testOnly?'测试 ':''}${s} 分${passed&&!testOnly?' · 已过关':''}${revealed?' · 已公布':''}</h2><table>
 <tr><td>你的混合色</td><td>${rgbHex(m).toUpperCase()}</td></tr><tr><td>标准色</td><td>${rgbHex(target).toUpperCase()}</td></tr>
 <tr><td>Lab 色差 ΔE</td><td>${de.toFixed(2)}</td></tr><tr><td>本轮最佳/尝试</td><td>${best} 分 · 第 ${attempts} 次${testOnly?'（测试不计分）':''}</td></tr>
 ${revealed?`<tr><td>正确组合</td><td>${names}</td></tr>`:''}</table>
 ${s<PASS&&!revealed?'<p style="color:var(--muted); display:none;"></p>':''}
 ${s===100&&round<LEVELS?'<p style="color:var(--muted); display:none;"></p>':''}
 ${revealed?'<p style="color:var(--muted); display:none;"></p>':''}`;
 
 $('next').classList.add('show');updateHud();save();if(s===100&&!testOnly&&round<LEVELS){cancelAdvance();advanceTimer=setTimeout(()=>{advanceTimer=null;$('next').click()},2200)}
}
function loop(t){if(!last)last=t;const dt=Math.min(50,t-last);last=t;const ds=dt/1000;
 if(spinning)vel=Math.min(vel+2600*ds,2400);
 else vel*=Math.pow(.18,ds);
 angle=(angle+vel*ds)%360;$('disc').style.transform=`rotate(${angle}deg)`;
 const k=Math.min(1,vel/1600);
 $('blend').style.opacity=(k*.92).toFixed(2);$('disc').style.filter=`blur(${(k*2.5).toFixed(1)}px)`;
 $('speedBar').style.width=(vel/2400*100)+'%';
 if(spinning||vel>8)raf=requestAnimationFrame(loop);else{raf=null;$('blend').style.opacity=0;$('disc').style.filter='';$('speedBar').style.width='0%';}
}
const startBtn=$('start');
function begin(e){e.preventDefault();cancelAdvance();if(spinning)return;if(!selected.size){startBtn.textContent='请先选择颜色';setTimeout(()=>startBtn.textContent='START',1600);return}spinning=true;startBtn.textContent='START';hasScoredOnce=true;startBtn.classList.add('holding');if(!raf){last=0;raf=requestAnimationFrame(loop)}}
function end(){if(!spinning)return;spinning=false;if(hasScoredOnce){hasScoredOnce=false;score()}startBtn.textContent='START';startBtn.classList.remove('holding');setTimeout(()=>{if(!spinning)startBtn.textContent='START'},1200)}
startBtn.addEventListener('pointerdown',begin);addEventListener('pointerup',end);addEventListener('pointercancel',end);
startBtn.addEventListener('keydown',e=>{if(e.code==='Space')begin(e)});startBtn.addEventListener('keyup',e=>{if(e.code==='Space')end()});
function restoreRound(){const h=roundHistory[round];if(h){({target,correct,attempts,best,revealed,passed}=h);selected=new Set(h.selected);newRound(true);if(passed||revealed||attempts>0){$('next').classList.add('show');$('next').textContent=round>=LEVELS?'再来一局 ↺':'下一轮 →'}if(revealed){$('result').innerHTML='<h2 style="text-align: center;">已公布</h2><p>正确组合：'+correct.map(i=>COLORS[i].name).join(' + ')+'</p>';$('result').classList.add('show')}}else{selected.clear();newRound()}}
$('prev').onclick=()=>{cancelAdvance();if(round<=1)return;snapshot();round--;restoreRound()};
$('next').onclick=()=>{cancelAdvance();snapshot();if(round>=LEVELS){round=1;scores=[];roundHistory={}}else round++;restoreRound()};
$('reset').onclick=()=>{cancelAdvance();if(confirm('清空全部进度，从第 1 轮重开？')){localStorage.removeItem(SAVE);round=1;scores=[];roundHistory={};selected.clear();newRound()}};
let AC;function tone(f){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.35);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.36)}catch(e){}}
addEventListener('keydown',e=>{const i=COLORS.findIndex(c=>c.key&&c.key.toLowerCase()===e.key.toLowerCase());if(i>=0)toggle(i)});
const menuButton=$('menuButton'),menuPanel=$('menuPanel');
function updateMenu(){document.querySelectorAll('.mode-button').forEach(b=>{const active=Number(b.dataset.mode)===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)})}
menuButton.onclick=()=>{menuPanel.hidden=!menuPanel.hidden;menuButton.setAttribute('aria-expanded',String(!menuPanel.hidden))};
document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap')){menuPanel.hidden=true;menuButton.setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){menuPanel.hidden=true;menuButton.setAttribute('aria-expanded','false');menuButton.focus()}});
document.querySelectorAll('.mode-button').forEach(b=>b.onclick=()=>{const nextMode=Number(b.dataset.mode);menuPanel.hidden=true;menuButton.setAttribute('aria-expanded','false');if(nextMode===mode)return;cancelAdvance();save();if(raf)cancelAnimationFrame(raf);raf=null;spinning=false;vel=0;hasScoredOnce=false;mode=nextMode;localStorage.setItem('colorspin_mode',String(mode));COLORS=mode===24?BASE_COLORS.concat(EXTRA_COLORS):BASE_COLORS;SAVE=mode===12?'colorspin_save_v2':'colorspin_save_24_v1';selected=new Set();round=1;scores=[];attempts=0;best=0;target=null;correct=[];revealed=false;passed=false;roundHistory={};angle=0;buildKeys();if(load())restoreLoaded();else newRound();updateMenu()});
function restoreLoaded(){newRound(true);if(revealed){$('result').innerHTML='<h2 style="text-align: center;">已公布</h2><p style="text-align: center;">正确组合：'+correct.map(i=>COLORS[i].name).join(' + ')+'</p>';$('result').classList.add('show');$('next').classList.add('show')}else if(passed||attempts>0){$('next').classList.add('show')}}
buildKeys();updateMenu();if(load())restoreLoaded();else newRound();
</script>
</body></html>
